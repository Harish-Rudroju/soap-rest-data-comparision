<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/turing-engine-icon.png') }}">

<script>
  (function () {
    var root = document.documentElement;
    var stored = null;
    try { stored = localStorage.getItem('turing-engine-theme'); } catch (e) {}
    if (stored === 'light' || stored === 'dark') {
      root.setAttribute('data-theme', stored);
    }
  })();
</script>

<button type="button" id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
  <span class="theme-icon-sun" aria-hidden="true">&#9728;&#65039;</span>
  <span class="theme-icon-moon" aria-hidden="true">&#127769;</span>
</button>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle-btn');
    btn.addEventListener('click', function () {
      var current = root.getAttribute('data-theme');
      var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var effectiveDark = current ? current === 'dark' : systemDark;
      var next = effectiveDark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('turing-engine-theme', next); } catch (e) {}
    });
  })();
</script>
